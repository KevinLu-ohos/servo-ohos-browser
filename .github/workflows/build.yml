name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'release/**', '**.md']

jobs:
  ohos-build:
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo + servo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/Library/Caches/cargo-ohos
            ~/.cache/cargo-ohos
            servo/target
          key: servo-ohos-${{ hashFiles('patches/*.patch') }}
          restore-keys: servo-ohos-

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add aarch64-unknown-linux-ohos --toolchain 1.97.1

      - name: Install cargo-ohos
        run: cargo install cargo-ohos --locked

      - name: Fetch OpenHarmony SDK
        env:
          # 不带 token 时 GitHub API 会 403 限流，导致 SDK 下载失败
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo ohos init sdk --version=6.0.0.1 2>&1 | tail -5

      # 打包 HAP 需要 hvigor；本地由 DevEco 提供，CI 上从 OHOS npm 源安装
      - name: Install hvigor
        run: |
          mkdir -p "$RUNNER_TEMP/hvigor-env"
          cd "$RUNNER_TEMP/hvigor-env"
          npm config set @ohos:registry https://repo.harmonyos.com/npm/
          npm init -y >/dev/null
          npm install --no-audit --no-fund @ohos/hvigor @ohos/hvigor-ohos-plugin
          test -f node_modules/@ohos/hvigor/bin/hvigor.js
          echo "HVIGOR_PATH=$PWD" >> "$GITHUB_ENV"
          if [ -n "${JAVA_HOME_17_arm64:-}" ]; then
            echo "JAVA_HOME=$JAVA_HOME_17_arm64" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          # mach 内部会调用 `cargo ohos env`，它同样要访问 GitHub API
          # 拉取 LLVM 工具链清单；不带 token 会 403。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${OHOS_SDK_NATIVE:-}" ]; then
            SDK=$(find "$HOME/Library/Caches/cargo-ohos" "$HOME/.cache/cargo-ohos" \
                    -maxdepth 9 -type d -path "*ohos-sdk*/native" 2>/dev/null | head -1)
            echo "detected SDK: ${SDK:-<none>}"
            if [ -z "$SDK" ]; then
              echo "::error::OpenHarmony native SDK not found; 'cargo ohos init sdk' did not produce it"
              exit 1
            fi
            echo "OHOS_SDK_NATIVE=$SDK" >> "$GITHUB_ENV"
            # mach 要的是 SDK 根目录：.../ohos-sdk/<ver>/<host>
            echo "OHOS_BASE_SDK_HOME=$(cd "$SDK/../.." && pwd)" >> "$GITHUB_ENV"

            # hvigor 的 DEVECO_SDK_HOME 必须是 DevEco 的布局：
            #   <DEVECO_SDK_HOME>/default/openharmony/{native,ets,toolchains,...}
            # cargo-ohos 下载的 SDK 是 <base>/<api>/{native,ets,...}，
            # 用符号链接拼出同样的结构，避免 "Invalid value of DEVECO_SDK_HOME"。
            API_DIR=$(cd "$SDK/.." && pwd)
            COMPAT="$RUNNER_TEMP/ohos-sdk-compat"
            mkdir -p "$COMPAT/default"
            ln -sfn "$API_DIR" "$COMPAT/default/openharmony"
            echo "DEVECO_SDK_HOME=$COMPAT" >> "$GITHUB_ENV"
          fi
          ./scripts/build.sh
