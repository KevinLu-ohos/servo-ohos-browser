name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'release/**', '**.md']

jobs:
  ohos-build:
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo + servo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            servo/target
          key: servo-ohos-${{ hashFiles('patches/*.patch') }}
          restore-keys: servo-ohos-

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add aarch64-unknown-linux-ohos --toolchain 1.97.1

      - name: Install cargo-ohos
        run: cargo install cargo-ohos --locked

      - name: Fetch OpenHarmony SDK
        run: cargo ohos init sdk --version=6.0.0.1 2>&1 | tail -5

      # 打包 HAP 需要 hvigor；本地由 DevEco 提供，CI 上从 OHOS npm 源安装
      - name: Install hvigor
        run: |
          mkdir -p "$RUNNER_TEMP/hvigor-env"
          cd "$RUNNER_TEMP/hvigor-env"
          npm config set @ohos:registry https://repo.harmonyos.com/npm/
          npm init -y >/dev/null
          npm install --no-audit --no-fund @ohos/hvigor @ohos/hvigor-ohos-plugin
          test -f node_modules/@ohos/hvigor/bin/hvigor.js
          echo "HVIGOR_PATH=$PWD" >> "$GITHUB_ENV"
          if [ -n "${JAVA_HOME_17_arm64:-}" ]; then
            echo "JAVA_HOME=$JAVA_HOME_17_arm64" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          if [ -z "${OHOS_SDK_NATIVE:-}" ]; then
            SDK=$(find "$HOME/.cache/cargo-ohos" -maxdepth 6 -type d -name native 2>/dev/null | head -1)
            echo "detected SDK: $SDK"
            echo "OHOS_SDK_NATIVE=$SDK" >> "$GITHUB_ENV"
          fi
          ./scripts/build.sh
